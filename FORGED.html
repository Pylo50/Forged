<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FORGED · DAWG Kinetic Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07070d">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href='data:application/manifest+json,{"name":"FORGED","short_name":"FORGED","start_url":".","display":"standalone","background_color":"#07070d","theme_color":"#07070d"}'>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg: #07070d;
      --panel: #131422;
      --panel-dark: #0a0b14;
      --border-outer: #000;
      --border-light: #3f466b;
      --gold: #f4b41b;
      --gold-light: #fff280;
      --crimson: #e63946;
      --cyan: #00f0ff;
      --text: #e0e6ed;
      --text-muted: #6c7693;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1.5;
      image-rendering: pixelated;
      min-height: 100vh;
      overflow-x: hidden;
      transition: transform 0.05s ease-out;
    }

    /* Fullscreen FX Canvas */
    #fxCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    /* CRT Scanlines */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 998;
      pointer-events: none;
      opacity: 0.5;
    }

    /* RPG Window */
    .rpg-box {
      background: var(--panel);
      border: 4px solid var(--border-outer);
      box-shadow: 
        inset 4px 4px 0 var(--border-light),
        inset -4px -4px 0 #05060a,
        0 4px 0 rgba(0,0,0,0.8);
      padding: 12px;
      margin-bottom: 12px;
      position: relative;
    }

    .rpg-box-gold {
      border-color: #594000;
      box-shadow: 
        inset 3px 3px 0 var(--gold-light),
        inset -3px -3px 0 #734d00,
        0 4px 0 rgba(0,0,0,0.8);
    }

    /* Kinetic Badges */
    .badge {
      display: inline-block;
      background: var(--gold);
      color: #120900;
      border: 2px solid #000;
      padding: 3px 6px;
      font-size: 8px;
      font-weight: bold;
    }

    .badge-pulse {
      animation: statPop 0.35s ease-out;
    }

    /* Meter Bars */
    .meter-container {
      background: #000;
      border: 3px solid #282a36;
      height: 16px;
      position: relative;
      margin: 6px 0 10px 0;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      transition: width 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    .meter-fill-exp {
      background: repeating-linear-gradient(90deg, var(--gold) 0, var(--gold) 8px, #9e7400 8px, #9e7400 12px);
      box-shadow: 0 0 12px rgba(244, 180, 27, 0.6);
    }

    .meter-fill-boss {
      background: repeating-linear-gradient(90deg, var(--crimson) 0, var(--crimson) 8px, #750d18 8px, #750d18 12px);
      box-shadow: 0 0 12px rgba(230, 57, 70, 0.6);
    }

    .meter-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
    }

    /* Buttons */
    .rpg-btn {
      font-family: inherit;
      font-size: 9px;
      color: #fff;
      background: #25283d;
      border: 3px solid #000;
      box-shadow: 
        inset 2px 2px 0 #525885,
        inset -2px -2px 0 #0f101a,
        2px 2px 0 #000;
      padding: 8px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
      transition: transform 0.05s ease;
    }

    .rpg-btn:active {
      transform: scale(0.95);
    }

    .rpg-btn-gold {
      background: var(--gold);
      color: #1a1000;
      box-shadow: 
        inset 2px 2px 0 var(--gold-light),
        inset -2px -2px 0 #734d00,
        2px 2px 0 #000;
      font-weight: bold;
    }

    /* Quests */
    .quest-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-dark);
      border: 2px solid #000;
      padding: 10px;
      margin-bottom: 8px;
      transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s;
    }

    .quest-item.completed {
      opacity: 0.4;
      filter: grayscale(0.8);
      transform: scale(0.98);
    }

    .quest-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 65%;
    }

    .quest-reward {
      font-size: 7px;
      color: var(--gold);
    }

    .sprite {
      image-rendering: pixelated;
      width: 44px;
      height: 44px;
    }

    .hero-display {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    /* Floating XP Text */
    @keyframes dawgFloat {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
      20% { transform: translate(-50%, -10px) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -45px) scale(1); opacity: 0; }
    }

    .pop-text {
      position: absolute;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000, 0 0 10px rgba(244,180,27,0.8);
      pointer-events: none;
      animation: dawgFloat 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
      z-index: 10000;
    }

    @keyframes statPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); color: #fff; text-shadow: 0 0 8px var(--cyan); }
      100% { transform: scale(1); }
    }

    /* Rank Up Screen Takeover */
    #levelModal {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(20,20,38,0.95) 0%, rgba(7,7,13,0.98) 100%);
      z-index: 10001;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .rank-title {
      font-size: 20px;
      color: var(--gold-light);
      text-shadow: 0 0 15px rgba(244,180,27,0.9), 3px 3px 0 #000;
      animation: statPop 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite alternate;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <canvas id="fxCanvas"></canvas>

  <header class="rpg-box rpg-box-gold">
    <div class="hero-display">
      <svg class="sprite" viewBox="0 0 16 16" fill="none">
        <rect x="5" y="1" width="6" height="2" fill="#e0e6ed"/><rect x="4" y="3" width="8" height="5" fill="#525975"/><rect x="6" y="4" width="4" height="2" fill="#000"/><rect x="7" y="5" width="2" height="1" fill="#f4b41b"/><rect x="5" y="8" width="6" height="5" fill="#247ba0"/><rect x="3" y="8" width="2" height="4" fill="#525975"/><rect x="11" y="8" width="2" height="4" fill="#525975"/><rect x="13" y="4" width="1" height="8" fill="#e0e6ed"/><rect x="12" y="8" width="3" height="1" fill="#f4b41b"/><rect x="5" y="13" width="2" height="3" fill="#12131c"/><rect x="9" y="13" width="2" height="3" fill="#12131c"/>
      </svg>
      <div style="flex: 1;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span id="heroName" style="font-size: 11px; color: var(--gold-light);">WARRIOR</span>
          <span class="badge" id="heroLevelBadge">LVL 1</span>
        </div>
        <div style="font-size: 7px; color: var(--text-muted); margin: 3px 0 6px 0;">STATUS: LOCKED IN</div>
        <div class="meter-container">
          <div class="meter-fill meter-fill-exp" id="expFill" style="width: 20%;"></div>
          <div class="meter-label" id="expLabel">EXP: 20 / 100</div>
        </div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 8px;">
      <span>POWER: <b id="statPower" style="color: var(--gold);">6</b></span>
      <span class="badge" style="background: var(--crimson); color: #fff;" id="streakBadge">⬟ THE VOW · 1 DAY</span>
    </div>
  </header>

  <nav class="nav-bar">
    <button class="rpg-btn" onclick="showTab('quests')">⚔ QUESTS</button>
    <button class="rpg-btn" onclick="showTab('boss')">☠ BOSS</button>
    <button class="rpg-btn" onclick="showTab('vow')">⚜ THE VOW</button>
  </nav>

  <main id="tabQuests">
    <div class="rpg-box">
      <div style="font-size: 9px; color: var(--gold); margin-bottom: 10px;">DAILY PROTOCOLS</div>
      <div id="questContainer"></div>
    </div>
  </main>

  <main id="tabBoss" class="hidden">
    <div class="rpg-box" style="text-align: center;">
      <span class="badge" style="background: var(--crimson); color: #fff;">DEMON OF INERTIA</span>
      <div style="margin: 14px 0;">
        <svg class="sprite" id="bossSprite" style="margin: 0 auto; width: 64px; height: 64px; transition: transform 0.1s;" viewBox="0 0 16 16" fill="none">
          <rect x="4" y="1" width="8" height="2" fill="#781020"/><rect x="2" y="3" width="12" height="8" fill="#e63946"/><rect x="3" y="11" width="10" height="3" fill="#781020"/><rect x="4" y="5" width="2" height="3" fill="#fff280"/><rect x="10" y="5" width="2" height="3" fill="#fff280"/><rect x="7" y="8" width="2" height="2" fill="#000"/><rect x="5" y="12" width="1" height="2" fill="#fff"/><rect x="7" y="12" width="1" height="2" fill="#fff"/><rect x="9" y="12" width="1" height="2" fill="#fff"/><rect x="1" y="2" width="2" height="4" fill="#e0e6ed"/><rect x="13" y="2" width="2" height="4" fill="#e0e6ed"/>
        </svg>
      </div>
      <div id="bossName" style="font-size: 11px; margin-bottom: 6px; color: #ff6b6b;">MALAKOR THE UNPRODUCTIVE</div>
      <div class="meter-container">
        <div class="meter-fill meter-fill-boss" id="bossHpFill" style="width: 100%;"></div>
        <div class="meter-label" id="bossHpLabel">HP: 200 / 200</div>
      </div>
      <button class="rpg-btn rpg-btn-gold" style="width: 100%; margin-top: 8px;" onclick="strikeBossManual(event)">⚔ EXECUTE ATTACK (-15 HP)</button>
    </div>
  </main>

  <main id="tabVow" class="hidden">
    <div class="rpg-box" style="text-align: center;">
      <span class="badge">DISCIPLINE STREAK</span>
      <h2 style="font-size: 22px; color: var(--gold-light); margin: 16px 0;" id="vowBigCounter">1 DAYS</h2>
      <button class="rpg-btn rpg-btn-gold" style="width: 100%; margin-bottom: 8px;" onclick="checkInStreak(event)">LOCK IN TODAY</button>
      <button class="rpg-btn" style="border-color: var(--crimson); font-size: 8px;" onclick="resetStreak()">RESET COUNTER</button>
    </div>
  </main>

  <!-- Level Up Fullscreen Takeover (DAWG Style) -->
  <div id="levelModal" class="hidden" onclick="dismissLevelUp()">
    <div class="rank-title">RANK ASCENDED</div>
    <div style="font-size: 12px; margin-bottom: 16px;" id="rankSubtitle">LEVEL 2 REACHED</div>
    <p style="font-size: 8px; color: var(--gold); margin-bottom: 24px;">ALL STATS BOOSTED · POWER +3</p>
    <button class="rpg-btn rpg-btn-gold" style="padding: 12px 24px;">CLAIM EVOLUTION</button>
  </div>

  <script>
    /* 1. AUDIO SYNTHESIZER */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'level') {
        [220, 330, 440, 660, 880].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'square';
          o.frequency.setValueAtTime(freq, now + idx * 0.08);
          g.gain.setValueAtTime(0.15, now + idx * 0.08);
          g.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.12);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(now + idx * 0.08);
          o.stop(now + idx * 0.08 + 0.14);
        });
      }
    }

    /* 2. CANVAS PARTICLE BURST ENGINE (DAWG FX) */
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnBurst(x, y, count = 28, color = '#f4b41b') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.floor(Math.random() * 4 + 2) * 2, // pixelated stepping
          color,
          alpha: 1,
          life: 1
        });
      }
    }

    function renderFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // gravity
        p.alpha -= 0.025;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(renderFX);
    }
    renderFX();

    /* 3. IMPACT PUNCH & SCREEN JUICE */
    function triggerImpact(clientX, clientY, text = '+XP', color = '#f4b41b') {
      // Android Haptics
      if ('vibrate' in navigator) navigator.vibrate([40, 30, 60]);
      playSfx('hit');

      // Camera Punch
      document.body.style.transform = `scale(1.025) translate(${Math.random() * 6 - 3}px, ${Math.random() * 6 - 3}px)`;
      setTimeout(() => document.body.style.transform = 'none', 80);

      // Particle Blast
      spawnBurst(clientX || window.innerWidth / 2, clientY || window.innerHeight / 2, 28, color);

      // Kinetic Pop Text
      const pop = document.createElement('div');
      pop.className = 'pop-text';
      pop.innerText = text;
      pop.style.left = `${clientX || window.innerWidth / 2}px`;
      pop.style.top = `${clientY || window.innerHeight / 2}px`;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 800);
    }

    /* 4. GAME ENGINE & STATE */
    const DEFAULT_DATA = {
      hero: { name: "WARRIOR", level: 1, exp: 20, maxExp: 100, power: 6, streak: 1 },
      boss: { name: "MALAKOR THE UNPRODUCTIVE", hp: 200, maxHp: 200 },
      quests: [
        { id: 1, text: "60 MIN DEEP WORK / FOCUS", exp: 35, dmg: 30, completed: false },
        { id: 2, text: "PHYSICAL TRAINING SESSION", exp: 30, dmg: 25, completed: false },
        { id: 3, text: "CLEAN FUEL / ZERO JUNK", exp: 25, dmg: 20, completed: false },
        { id: 4, text: "COLD SHOWER PROTOCOL", exp: 20, dmg: 15, completed: false }
      ]
    };

    let state = JSON.parse(localStorage.getItem('FORGED_DATA')) || DEFAULT_DATA;
    function save() { localStorage.setItem('FORGED_DATA', JSON.stringify(state)); render(); }

    function completeQuest(id, event) {
      const q = state.quests.find(item => item.id === id);
      if (!q || q.completed) return;
      q.completed = true;

      const rect = event.currentTarget.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      triggerImpact(x, y, `+${q.exp} EXP`, '#f4b41b');

      state.hero.exp += q.exp;
      state.boss.hp = Math.max(0, state.boss.hp - q.dmg);

      if (state.hero.exp >= state.hero.maxExp) {
        state.hero.level += 1;
        state.hero.exp -= state.hero.maxExp;
        state.hero.maxExp = Math.round(state.hero.maxExp * 1.4);
        state.hero.power += 3;
        setTimeout(() => triggerLevelUp(), 300);
      }
      save();
    }

    function strikeBossManual(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      triggerImpact(rect.left + rect.width / 2, rect.top, '-15 HP', '#e63946');
      
      const sprite = document.getElementById('bossSprite');
      sprite.style.transform = 'scale(0.85) rotate(5deg)';
      setTimeout(() => sprite.style.transform = 'none', 120);

      state.boss.hp = Math.max(0, state.boss.hp - 15);
      if (state.boss.hp === 0) {
        state.boss.hp = 250;
        state.boss.maxHp = 250;
        state.boss.name = "DORMATH THE APATHETIC";
        setTimeout(() => triggerImpact(window.innerWidth / 2, window.innerHeight / 2, 'BOSS DEFEATED!', '#fff'), 200);
      }
      save();
    }

    function triggerLevelUp() {
      playSfx('level');
      if ('vibrate' in navigator) navigator.vibrate([100, 50, 100, 50, 200]);
      document.getElementById('rankSubtitle').innerText = `LEVEL ${state.hero.level} REACHED`;
      document.getElementById('levelModal').classList.remove('hidden');
      spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 70, '#00f0ff');
    }

    function dismissLevelUp() {
      document.getElementById('levelModal').classList.add('hidden');
    }

    function checkInStreak(event) {
      state.hero.streak += 1;
      const rect = event.currentTarget.getBoundingClientRect();
      triggerImpact(rect.left + rect.width / 2, rect.top, '+1 STREAK', '#00f0ff');
      save();
    }

    function resetStreak() {
      if (confirm("Reset current vow streak to 0?")) {
        state.hero.streak = 0;
        save();
      }
    }

    function showTab(tab) {
      document.getElementById('tabQuests').classList.toggle('hidden', tab !== 'quests');
      document.getElementById('tabBoss').classList.toggle('hidden', tab !== 'boss');
      document.getElementById('tabVow').classList.toggle('hidden', tab !== 'vow');
    }

    function render() {
      document.getElementById('heroName').innerText = state.hero.name;
      document.getElementById('heroLevelBadge').innerText = `LVL ${state.hero.level}`;
      document.getElementById('statPower').innerText = state.hero.power;
      document.getElementById('streakBadge').innerText = `⬟ THE VOW · ${state.hero.streak} DAYS`;
      document.getElementById('vowBigCounter').innerText = `${state.hero.streak} DAYS`;

      const expPct = Math.min(100, Math.round((state.hero.exp / state.hero.maxExp) * 100));
      document.getElementById('expFill').style.width = `${expPct}%`;
      document.getElementById('expLabel').innerText = `EXP: ${state.hero.exp} / ${state.hero.maxExp}`;

      document.getElementById('bossName').innerText = state.boss.name;
      const bossPct = Math.min(100, Math.round((state.boss.hp / state.boss.maxHp) * 100));
      document.getElementById('bossHpFill').style.width = `${bossPct}%`;
      document.getElementById('bossHpLabel').innerText = `HP: ${state.boss.hp} / ${state.boss.maxHp}`;

      const container = document.getElementById('questContainer');
      container.innerHTML = "";
      state.quests.forEach(q => {
        const item = document.createElement('div');
        item.className = `quest-item ${q.completed ? 'completed' : ''}`;
        item.innerHTML = `
          <div class="quest-info">
            <span>${q.text}</span>
            <span class="quest-reward">+${q.exp} EXP · -${q.dmg} BOSS HP</span>
          </div>
          <button class="rpg-btn ${q.completed ? '' : 'rpg-btn-gold'}" ${q.completed ? 'disabled' : ''}>
            ${q.completed ? 'LOCKED' : 'CLAIM'}
          </button>
        `;
        if (!q.completed) {
          item.querySelector('button').onclick = (e) => completeQuest(q.id, e);
        }
        container.appendChild(item);
      });
    }

    render();
  </script>
</body>
</html>
